[tool.poetry]
name = "haive-dataflow"
version = "0.1.0"
description = "haive-games for Haive framework"
authors = [
    "pr1m8 <william.astley@algebraicwealth.com>",
]
license = "MIT"
readme = "README.md"
packages = [
    { include = "haive", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
haive-core = {path = "../haive-core", develop = true}
haive-agents={path = "../haive-agents", develop = true}
haive-tools={path="../haive-tools",develop=true}
haive-games={path="../haive-games",develop=true}
pydantic = "^2.10.6"
langchain = "^0.3.20"
langchain-core = "^0.3.44"
langgraph = "^0.3.5"
psycopg = "^3.1.18"
psycopg-pool = "^3.2.1"
psycopg-binary = "^3.1.18"



[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"
starlette = "^0.46.2"


[tool.poetry.scripts]
init-db = "haive_dataflow.bin.init_db:init_database"

[build-system]
requires = [
    "poetry-core>=1.0.0",
]
build-backend = "poetry.core.masonry.api"
